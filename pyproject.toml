[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rsi-long-horizon"
version = "0.1.0"
description = "A small, auditable scaffold for RSI-based long-horizon agent experiments"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rsi-horizon = "rsi_horizon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

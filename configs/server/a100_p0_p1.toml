# Server-side P0/P1 profile. This is a configuration contract, not a claim
# that the listed model, scheduler, or GPU reservation is already available.

[project]
name = "rsi-long-horizon"
profile = "a100-p0-p1"
config_version = "0.1"
seed = 17

[paths]
# Current deployment prepares one official train fixture, not all splits.
project_root = "/nfs-data/sdf/lyf/rsi-long-horizon/code/RSI-Towards-LongHorizon"
harness_zero_root = "/nfs-data/sdf/lyf/rsi-long-horizon/code/RSI-Towards-LongHorizon/sources/repo/Harness_zero/harness-zero-main"
appworld_data_root = "/nfs-data/sdf/lyf/rsi-long-horizon/appworld-native/data"
run_root = "/nfs-data/sdf/lyf/rsi-long-horizon/runs"
cache_root = "/nfs-data/sdf/lyf/rsi-long-horizon/cache"

[scheduler]
# Confirmed 2026-10-26: select an available physical GPU per run; accepted setup uses port 22.
type = "direct"
partition = ""
account = ""
max_wait_hours = 48
preemptible = true
max_concurrent_jobs = 1
gpu_type = "A100"
gpu_count_per_job = 1
gpu_memory_gb = "detect"

[environment]
python_min = "3.12"
python_max_exclusive = "3.14"
harbor_version = "0.21.0"
appworld_version = "0.1.3.post1"
uv_lock_required = false
dependency_lock = "configs/server/student_inference_linux_wheels.json"
docker_required_for_appworld = false
execution_backend = "bubblewrap-pipe"
network_required_for_setup = false
workstation_network_required_for_preparation = true

[budget]
pilot_tasks = 1
diagnostic_tasks = 5
diagnostic_max_tasks = 20
max_rollout_attempts_per_task = 2
reviewer_max_calls_per_episode = 32
reviewer_max_replacements_per_episode = 8
max_episode_steps = 64
max_wall_time_minutes_per_task = 30
max_total_gpu_hours_p0_p1 = 12

[student]
model_id = "Qwen/Qwen3.5-9B"
model_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
tokenizer_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
chat_template_revision = "c202236235762e1c871ad0ccb60c8ee5ba337b9a"
config = "configs/models/qwen35_9b.toml"
enable_thinking = true
temperature = 0.6
top_p = 0.95
top_k = 20
max_new_tokens = 8192
max_context_tokens = 32768

[teacher]
provider = "TODO"
model_id = "TODO"
model_revision = "TODO"
temperature = 0.0
max_context_tokens = 32768

[harness]
student_component = "empty"
reference_component = "appworld"
review_protocol = "pass_or_replace_before_execution"
student_observation_view = "public_only"

[benchmark]
id = "appworld"
version = "0.1.0"
train_split = "official_train_single_prepared_fixture"
installed_train_task = "07b42fd_1"
reference_train_split = "split_train147.txt"
dev_split = "TODO_create_grouped_dev_split"
test_split = "split_test168.txt"
challenge_split = "split_challenge417.txt"
task_grouping = "scenario_or_task_family"
dependency_annotation = "official_metadata_plus_manual_audit"
test_access = "frozen_after_protocol_lock"

[conditions.B0]
description = "Initial student with the deployment harness, no reviewer"
reviewer_enabled = false
train = false

[conditions.B1]
description = "Initial student with fixed K0/reviewer, no training"
reviewer_enabled = true
train = false
reviewer_component = "appworld"

[outputs]
required_files = [
  "config_resolved.toml",
  "environment_snapshot.json",
  "manifest.json",
  "run_summary.json",
  "student_visible.jsonl",
  "audit_private.jsonl",
  "verifier_result.json",
  "failure_taxonomy.json",
]
training_data_must_use = "student_visible.jsonl_only"
test_data_must_not_enter = true
